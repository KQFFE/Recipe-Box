name: .NET build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RecipeBox.slnx

      - name: Build
        run: dotnet build RecipeBox.slnx --configuration Release --no-restore

      - name: Install Chromium for browser tests
        run: .\tests\RecipeBox.BrowserTests\bin\Release\net10.0\playwright.ps1 install chromium

      - name: Test
        run: dotnet test RecipeBox.slnx --configuration Release --no-build --no-restore
