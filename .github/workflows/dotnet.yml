name: .NET build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore unit tests
        run: dotnet restore tests\RecipeBox.Tests\RecipeBox.Tests.csproj

      - name: Restore browser tests
        run: dotnet restore tests\RecipeBox.BrowserTests\RecipeBox.BrowserTests.csproj

      - name: Build unit tests
        run: dotnet build tests\RecipeBox.Tests\RecipeBox.Tests.csproj --configuration Release --no-restore

      - name: Build browser tests
        run: dotnet build tests\RecipeBox.BrowserTests\RecipeBox.BrowserTests.csproj --configuration Release --no-restore

      - name: Install Chromium
        run: .\tests\RecipeBox.BrowserTests\bin\Release\net10.0\playwright.ps1 install chromium

      - name: Run unit tests
        run: dotnet test tests\RecipeBox.Tests\RecipeBox.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run browser tests
        run: dotnet test tests\RecipeBox.BrowserTests\RecipeBox.BrowserTests.csproj --configuration Release --no-build --no-restore

  android-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android app
        run: dotnet build src/RecipeBox.Mobile/RecipeBox.Mobile.csproj --configuration Release --framework net10.0-android
